# Builds a tagged snailmail release and publishes it as a GitHub Release.
#
# This workflow does not publish a package repository. Distribution is the job
# of the shellcell/postoffice workspace, which adopts these assets by digest and
# serves them from dl.shellcell.dev. Keeping the two apart is what lets snailmail
# be one tool among several rather than a special case.
#
# Assets carry the names their formats expect — the raw convention
# <name>_<version>_<os>_<arch>.<ext> for archives, and the Debian convention for
# packages — so the adopting workspace needs no identity flags: each filename
# already says what the artifact is.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The version is read from the tag, and checkout fetches no tags by
          # default. Without this every build stamps as untagged and the
          # Makefile refuses to call it a release.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Everything a release is made of lives in the Makefile, so a release
      # built here is built the same way as one built by hand. nfpm renders
      # deb, rpm and apk in pure Go, which is why no packaging toolchain or
      # container is installed for it.
      # make release installs every package in its own distribution and runs it,
      # and the arm64 containers cannot execute on an amd64 runner without
      # emulation registered for them.
      - name: Register emulation for the arm64 package checks
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes >/dev/null

      - name: Build the release
        run: make release

      - name: Verify the assets name the release they claim
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          ls -1 dist
          for asset in \
            "snailmail_${version}_linux_amd64.tar.gz" \
            "snailmail_${version}-1_amd64.deb" \
            "snailmail-${version}-1.x86_64.rpm" \
            "snailmail_${version}-r1_x86_64.apk"; do
            test -f "dist/${asset}" || { echo "::error::missing ${asset}"; exit 1; }
          done
          mkdir -p runner && tar -xzf "dist/snailmail_${version}_linux_amd64.tar.gz" -C runner
          # A binary that cannot name its own version must not be published under
          # one. This is the last point where that is still cheap to catch.
          reported=$(./runner/snailmail version --json | tr -d ' \n')
          case "$reported" in
            *"\"version\":\"${version}\""*) echo "binary reports ${version}" ;;
            *) echo "::error::binary reports ${reported}, expected version ${version}"; exit 1 ;;
          esac
          cat dist/SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      # The release is now durable and public, which is what postoffice adopts
      # from. It pins each asset to the digest in SHA256SUMS and publishes to
      # dl.shellcell.dev; this repository never writes there itself.
      #
      # github.token cannot dispatch across repositories. This needs a token with
      # Contents: write on the workspace repository — the dispatches endpoint is
      # gated on Contents, not on pull-request permission. Without the secret the
      # release still succeeds and the publication is simply run by hand.
      - name: Ask postoffice to publish
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          WORKSPACE: ${{ vars.POSTOFFICE_REPOSITORY || 'shellcell/postoffice' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "no dispatch token configured; publish postoffice by hand"
            exit 0
          fi
          gh api "repos/${WORKSPACE}/dispatches" \
            --field event_type=release \
            --field "client_payload[repository]=${GITHUB_REPOSITORY}" \
            --field "client_payload[tag]=${TAG}"
