# Template: publish a snailmail workspace from GitHub Actions.
#
# This is an example to copy into your own workspace repository as
# .github/workflows/snailmail.yml — it is not this repository's CI, which lives
# in .github/workflows/ci.yml. Copying it verbatim is the intent; the notes
# below are the parts you must supply.
#
# Requires in the copying repository:
#   - a committed snailmail.toml and repos/*.lock.toml (see `snailmail init`)
#   - full history: publication ledgers are validated against reachable history
#
# Configure only what your hosts need:
#   vars.AWS_ROLE_ARN, vars.AWS_REGION           OIDC-backed S3 access
#   secrets.SNAILMAIL_GITHUB_TOKEN               cross-repository Pages writes
#   vars.SNAILMAIL_SIGNING_KEY_REF               <workspace-id>/<key-name>
#   secrets.SNAILMAIL_SIGNING_PRIVATE_KEY        encrypted private key
#   secrets.SNAILMAIL_KEY_PASSPHRASE             passphrase, >= 24 bytes
#                                                (mounted as a file, not an env
#                                                value — see the plan job)
#   vars.SNAILMAIL_APPROVAL_REPOSITORIES         comma-separated, approval gates
#   secrets.SNAILMAIL_APPROVAL_PRIVATE_KEY       Ed25519 approval key
#
# The apply job mounts the Docker socket so `--runner docker` can run
# verification containers. That grants the container root-equivalent control of
# the runner while it also holds cloud credentials and a write-scoped token;
# prefer a rootless runner or a dedicated build host if that trade is too wide.

name: snailmail

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the generated plan
        required: true
        type: boolean
        default: false

# A job added later inherits this rather than the repository default; each job
# below still narrows it further.
permissions:
  contents: read

concurrency:
  group: snailmail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --target test --tag snailmail-ci-test:${GITHUB_SHA} .

  plan:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: git checkout -B snailmail-ci "${GITHUB_SHA}"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: docker build --tag snailmail-ci:${GITHUB_SHA} .
      - name: Prepare repository signing key
        if: vars.SNAILMAIL_SIGNING_KEY_REF != ''
        env:
          SIGNING_KEY_REF: ${{ vars.SNAILMAIL_SIGNING_KEY_REF }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SNAILMAIL_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SNAILMAIL_KEY_PASSPHRASE }}
        run: |
          test -n "$SIGNING_PRIVATE_KEY"
          case "$SIGNING_KEY_REF" in
            *..*|/*|*\\*) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/snailmail-private-keys/$(dirname "$SIGNING_KEY_REF")"
          printf '%s' "$SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/snailmail-private-keys/$SIGNING_KEY_REF.asc"
          chmod 600 "$RUNNER_TEMP/snailmail-private-keys/$SIGNING_KEY_REF.asc"
          # A container's environment stays readable through the runtime's
          # inspection API for as long as the container exists, so the
          # passphrase goes in a file the container reads once.
          install -m 600 /dev/null "$RUNNER_TEMP/snailmail-passphrase"
          printf '%s' "$SIGNING_PASSPHRASE" > "$RUNNER_TEMP/snailmail-passphrase"
          sudo chown -R 0:0 "$RUNNER_TEMP/snailmail-private-keys" "$RUNNER_TEMP/snailmail-passphrase"
      - name: Plan
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          -v "$RUNNER_TEMP/snailmail-private-keys:/root/.local/share/snailmail/private-keys"
          -v "$RUNNER_TEMP/snailmail-passphrase:/run/snailmail-passphrase:ro"
          -w /workspace
          -e GH_TOKEN
          -e AWS_ACCESS_KEY_ID
          -e AWS_SECRET_ACCESS_KEY
          -e AWS_SESSION_TOKEN
          -e AWS_REGION
          -e SNAILMAIL_KEY_PASSPHRASE_FILE=/run/snailmail-passphrase
          snailmail-ci:${GITHUB_SHA}
          plan --out snailmail.snailmail-plan.json
        env:
          GH_TOKEN: ${{ secrets.SNAILMAIL_GITHUB_TOKEN || github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snailmail-plan-${{ github.sha }}
          path: snailmail.snailmail-plan.json
          if-no-files-found: error

  apply:
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: git checkout -B snailmail-ci "${GITHUB_SHA}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snailmail-plan-${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: docker build --tag snailmail-ci:${GITHUB_SHA} .
      - name: Create signed approval evidence
        if: vars.SNAILMAIL_APPROVAL_REPOSITORIES != ''
        env:
          APPROVAL_KEY: ${{ secrets.SNAILMAIL_APPROVAL_PRIVATE_KEY }}
          APPROVAL_REPOSITORIES: ${{ vars.SNAILMAIL_APPROVAL_REPOSITORIES }}
        run: |
          test -n "$APPROVAL_KEY"
          printf '%s' "$APPROVAL_KEY" > "$RUNNER_TEMP/snailmail-approval-key.json"
          chmod 600 "$RUNNER_TEMP/snailmail-approval-key.json"
          for repository in ${APPROVAL_REPOSITORIES//,/ }; do
            docker run --rm -v "$PWD:/workspace" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w /workspace snailmail-ci:${GITHUB_SHA} approve --plan snailmail.snailmail-plan.json --repository "$repository" --key "$RUNNER_TEMP/snailmail-approval-key.json" --yes
          done
      - name: Apply reviewed plan
        env:
          GH_TOKEN: ${{ secrets.SNAILMAIL_GITHUB_TOKEN || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/snailmail-tmp"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP/snailmail-tmp:$RUNNER_TEMP/snailmail-tmp" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e GH_TOKEN -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            -e TMPDIR="$RUNNER_TEMP/snailmail-tmp" \
            snailmail-ci:${GITHUB_SHA} apply --plan snailmail.snailmail-plan.json --runner docker
      - name: Push publication and deployment records
        run: git push origin HEAD:${GITHUB_REF_NAME}
      - name: Render public status
        run: docker run --rm -v "$PWD:/workspace" -w /workspace snailmail-ci:${GITHUB_SHA} render --output site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snailmail-status-${{ github.sha }}
          path: site
          if-no-files-found: error
